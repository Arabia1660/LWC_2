<template>
    <lightning-record-edit-form record-id={recordId} object-api-name="Case">
        <lightning-input-field field-name="CaseNumber" onchange={handleChange}></lightning-input-field>
        <lightning-input-field field-name="Status" onchange={handleChange}></lightning-input-field>
        <lightning-input-field field-name="Priority" onchange={handleChange}></lightning-input-field>
        <lightning-input-field field-name="AccountId" onchange={handleChange}></lightning-input-field>
        <lightning-input-field field-name="ContactId" onchange={handleChange}></lightning-input-field>
        <lightning-input-field field-name="Description" onchange={handleChange}></lightning-input-field>
        <lightning-button variant="brand" label="Update Case" onclick={handleSubmit}></lightning-button>
    </lightning-record-edit-form>
</template>
